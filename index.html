<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <title>Hot or Bot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #c8f135;
      --bg: #090b10;
      --panel: #111318;
      --border: rgba(255,255,255,0.08);
      --muted: rgba(255,255,255,0.45);
    }
    html, body { height: 100%; background: var(--bg); color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #app { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; }
    .shell { width: 100%; max-width: 430px; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }

    /* HEADER */
    .header { padding: 20px 20px 10px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .tagline { padding: 0 20px 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .verified-badge { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: #4f9ef8; border-radius: 50%; font-size: 10px; font-weight: 800; color: #fff; margin-left: 5px; vertical-align: middle; line-height: 1; }
    .pill { background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-size: 12px; color: var(--muted); }

    /* PROGRESS */
    .progress-bar { margin: 0 20px 14px; height: 4px; border-radius: 999px; background: var(--panel); overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.4s ease; }

    /* CARD */
    .card-wrap { padding: 0 16px; }
    .card { position: relative; border-radius: 28px; overflow: hidden; border: 1px solid var(--border); background: var(--panel); aspect-ratio: 3/4; max-height: 52vh; width: 100%; }
    .card video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.35) 50%, transparent 100%); }
    .card-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; }
    .card-name { font-size: 26px; font-weight: 700; }
    .card-meta { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 4px; }
    .card-prompt { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,0.5); font-style: italic; }

    /* REVEAL OVERLAY */
    .reveal-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.84); backdrop-filter: blur(6px);
      opacity: 0; transition: opacity 0.3s ease; pointer-events: none; border-radius: 28px;
      gap: 6px; padding: 24px;
    }
    .reveal-overlay.show { opacity: 1; pointer-events: auto; }
    .reveal-verdict { font-size: 42px; font-weight: 900; letter-spacing: -1px; }
    .reveal-verdict.bot { color: var(--accent); }
    .reveal-verdict.human { color: #a8f0c6; }
    .reveal-your-score { font-size: 15px; color: rgba(255,255,255,0.55); }
    .reveal-your-score span { color: #fff; font-weight: 700; }
    .reveal-sub { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; margin-top: 4px; }

    /* RATING GRID */
    .rating-section { padding: 14px 16px 4px; }
    .rating-label { font-size: 12px; color: var(--muted); margin-bottom: 10px; text-align: center; letter-spacing: 0.04em; text-transform: uppercase; }
    .rating-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .rating-btn {
      height: 52px; border-radius: 14px;
      border: 1px solid var(--border); background: var(--panel);
      color: #fff; font-size: 18px; font-weight: 700;
      cursor: pointer; transition: background 0.1s, border-color 0.1s, transform 0.1s;
    }
    .rating-btn:hover { background: rgba(200,241,53,0.15); border-color: var(--accent); }
    .rating-btn:active { transform: scale(0.94); }
    .rating-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .rating-btn.selected { background: var(--accent); border-color: var(--accent); color: #090b10; }

    /* NEXT */
    .next-row { padding: 12px 16px 24px; }
    .btn-next {
      width: 100%; border: none; border-radius: 22px; padding: 18px;
      font-size: 16px; font-weight: 700; background: var(--panel); color: #fff;
      cursor: pointer; border: 1px solid var(--border); display: none;
    }
    .btn-next.show { display: block; }

    /* SCORE SCREEN */
    .score-screen { display: none; flex-direction: column; flex: 1; padding: 36px 20px 28px; }
    .score-screen.show { display: flex; }
    .score-headline { font-size: 38px; font-weight: 800; line-height: 1.1; letter-spacing: -1px; }
    .score-headline span { color: var(--accent); }
    .score-sub { margin-top: 10px; font-size: 15px; color: var(--muted); line-height: 1.5; }
    .twist-box { margin-top: 28px; background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 20px; }
    .twist-label { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .twist-text { font-size: 17px; font-weight: 600; margin-top: 8px; }
    .twist-detail { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
    .score-grid { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .score-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 16px; text-align: center; }
    .score-tile-num { font-size: 30px; font-weight: 800; color: var(--accent); }
    .score-tile-label { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .email-cta { margin-top: 20px; }
    .email-cta label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .email-cta input { width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; font-size: 15px; color: #fff; outline: none; transition: border-color 0.2s; }
    .email-cta input::placeholder { color: var(--muted); }
    .email-cta input:focus { border-color: var(--accent); }
    .btn-get-matches { margin-top: 10px; width: 100%; border: none; border-radius: 22px; padding: 18px; font-size: 16px; font-weight: 700; background: var(--accent); color: #090b10; cursor: pointer; }
    .btn-get-matches:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-replay { margin-top: 12px; width: 100%; border: none; border-radius: 22px; padding: 16px; font-size: 15px; font-weight: 600; background: transparent; color: var(--muted); cursor: pointer; border: 1px solid var(--border); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.4s ease; }
  </style>
</head>
<body>
<div id="app">
<div class="shell">

  <!-- GAME VIEW -->
  <div id="game-view" style="display:flex; flex-direction:column; flex:1;">
    <div class="header">
      <div class="logo">Hot or <span>Bot</span></div>
      <div class="pill" id="round-label">1 / 8</div>
    </div>
    <div class="tagline">Arm Yourself With Data</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <div class="card-wrap">
      <div class="card" id="main-card">
        <video id="main-video" autoplay loop muted playsinline></video>
        <div class="card-overlay"></div>
        <div class="card-info">
          <div class="card-name" id="card-name"></div>
          <div class="card-meta" id="card-meta"></div>
          <div class="card-prompt" id="card-prompt"></div>
        </div>
        <div class="reveal-overlay" id="reveal-overlay">
          <div class="reveal-verdict" id="reveal-verdict"></div>
          <div class="reveal-your-score" id="reveal-your-score"></div>
          <div class="reveal-sub" id="reveal-sub"></div>
        </div>
      </div>
    </div>

    <div class="rating-section">
      <div class="rating-label">Rate 1 – 10</div>
      <div class="rating-grid" id="rating-grid"></div>
    </div>

    <div class="next-row">
      <button class="btn-next" id="btn-next" onclick="next()">Next</button>
    </div>
  </div>

  <!-- SCORE VIEW -->
  <div class="score-screen" id="score-screen">
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <div class="score-headline">Your avg:<br><span id="final-avg">0</span> / 10</div>
      <div class="score-sub" id="score-flavor"></div>

      <div class="twist-box fade-in">
        <div class="twist-label">We Get You</div>
        <div class="twist-text">We now have enough data to build a basic preference algorithm for you.</div>
        <div class="twist-detail"></div>
      </div>

      <div class="score-grid">
        <div class="score-tile">
          <div class="score-tile-num" id="stat-avg">-</div>
          <div class="score-tile-label">Avg rating given</div>
        </div>
        <div class="score-tile">
          <div class="score-tile-num" id="stat-high">-</div>
          <div class="score-tile-label">Highest rated bot</div>
        </div>
      </div>
    </div>
    <div class="email-cta">
      <label>Get your matches</label>
      <input type="email" id="email-input" placeholder="your@email.com" oninput="onEmailInput()" />
    </div>
    <button class="btn-get-matches" id="btn-get-matches" disabled onclick="submitEmail()">Build my algorithm →</button>
    <button class="btn-replay" onclick="replay()">Play again</button>
  </div>

</div>
</div>

<script>
const BASE = 'https://pearlouisebot.github.io/hotorbotdemo_Pearlouise';

const profiles = [
  { name: 'Jake',   age: 29, profession: 'Software Engineer',   education: 'Stanford MBA',  height: "6'1\"",  clip: 1 },
  { name: 'Liam',   age: 31, profession: 'VC-backed Founder',   education: 'Harvard Law',   height: "6'0\"",  clip: 2 },
  { name: 'Noah',   age: 28, profession: 'Product Manager',     education: 'MIT',           height: "5'11\"", clip: 3 },
  { name: 'Ethan',  age: 33, profession: 'Surgeon',             education: 'Cornell MD',    height: "6'2\"",  clip: 4 },
  { name: 'Mason',  age: 30, profession: 'Investment Banker',   education: 'Wharton MBA',   height: "6'0\"",  clip: 5 },
  { name: 'Logan',  age: 27, profession: 'Architect',           education: 'Yale',          height: "5'10\"", clip: 6 },
  { name: 'Lucas',  age: 32, profession: 'Entrepreneur',        education: 'Columbia MBA',  height: "6'1\"",  clip: 7 },
  { name: 'Aiden',  age: 34, profession: 'Venture Capitalist',  education: 'Dartmouth',     height: "6'3\"",  clip: 8 },
];

const TOTAL_ROUNDS = 25;
function buildRounds() {
  const rounds = [];
  while (rounds.length < TOTAL_ROUNDS) {
    const batch = [...profiles].sort(() => Math.random() - 0.5);
    rounds.push(...batch);
  }
  rounds.length = TOTAL_ROUNDS;
  return rounds;
}
let shuffled = buildRounds();
let current = 0;
let ratings = []; // all scores given
let rated = false;

function buildGrid() {
  const grid = document.getElementById('rating-grid');
  grid.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement('button');
    btn.className = 'rating-btn';
    btn.textContent = i;
    btn.id = 'rbtn-' + i;
    btn.onclick = () => rate(i);
    grid.appendChild(btn);
  }
}

function load(index) {
  rated = false;
  const p = shuffled[index];
  document.getElementById('round-label').textContent = `${index + 1} / ${shuffled.length}`;
  document.getElementById('progress-fill').style.width = `${(index / shuffled.length) * 100}%`;
  document.getElementById('card-name').innerHTML = `${p.name}, ${p.age} <span class="verified-badge">✓</span>`;
  document.getElementById('card-meta').textContent = `${p.profession} · ${p.education} · ${p.height}`;
  document.getElementById('card-prompt').textContent = '"why you shouldn\'t date me"';
  document.getElementById('main-video').src = `${BASE}/clips/clip-${p.clip}.mp4`;
  document.getElementById('main-video').load();
  document.getElementById('main-video').play().catch(() => {});

  document.getElementById('reveal-overlay').classList.remove('show');
  document.getElementById('btn-next').classList.remove('show');

  // reset buttons
  for (let i = 1; i <= 10; i++) {
    const b = document.getElementById('rbtn-' + i);
    if (b) { b.disabled = false; b.classList.remove('selected'); }
  }
}

function rate(score) {
  if (rated) return;
  rated = true;
  ratings.push(score);

  // highlight selected
  for (let i = 1; i <= 10; i++) {
    const b = document.getElementById('rbtn-' + i);
    if (!b) continue;
    b.disabled = true;
    if (i === score) b.classList.add('selected');
  }

  // show reveal — all are bots
  const ro = document.getElementById('reveal-overlay');
  document.getElementById('reveal-verdict').textContent = 'BOT';
  document.getElementById('reveal-verdict').className = 'reveal-verdict bot';
  document.getElementById('reveal-your-score').innerHTML = `You gave them a <span>${score}</span>`;
  document.getElementById('reveal-sub').textContent = 'Entirely synthesized by Sora. Not a real person.';
  ro.classList.add('show');

  const isLast = current >= shuffled.length - 1;
  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = isLast ? 'See results' : 'Next';
  nextBtn.classList.add('show');
}

function next() {
  current++;
  if (current >= shuffled.length) {
    showScore();
  } else {
    load(current);
  }
}

function showScore() {
  document.getElementById('game-view').style.display = 'none';
  document.getElementById('score-screen').classList.add('show');

  const avg = ratings.length ? (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1) : '0';
  const high = ratings.length ? Math.max(...ratings) : 0;

  document.getElementById('final-avg').textContent = avg;
  document.getElementById('stat-avg').textContent = avg;
  document.getElementById('stat-high').textContent = high + '/10';

  const n = parseFloat(avg);
  let flavor;
  if (n >= 8.5) flavor = "You're generous. Or very lonely. Either way, the bots thank you.";
  else if (n >= 7) flavor = "Solid scores. The AIs are blushing.";
  else if (n >= 5) flavor = "Lukewarm. The bots have noted this and will remember.";
  else if (n >= 3) flavor = "Tough Critic. These Sora-generated people did their best.";
  else flavor = "Brutal. They're not even real and you still rejected them.";

  document.getElementById('score-flavor').textContent = flavor;
}

function onEmailInput() {
  const val = document.getElementById('email-input').value.trim();
  const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
  document.getElementById('btn-get-matches').disabled = !valid;
}

function submitEmail() {
  const email = document.getElementById('email-input').value.trim();
  const btn = document.getElementById('btn-get-matches');
  btn.textContent = '✓ You\'re on the list!';
  btn.disabled = true;
  document.getElementById('email-input').disabled = true;
  // Step 2 will wire this to Supabase
  console.log('email captured:', email, 'ratings:', ratings);
}

function replay() {
  current = 0; ratings = [];
  shuffled = buildRounds();
  document.getElementById('score-screen').classList.remove('show');
  document.getElementById('game-view').style.display = 'flex';
  load(0);
}

// Init
buildGrid();
load(0);
</script>
</body>
</html>
